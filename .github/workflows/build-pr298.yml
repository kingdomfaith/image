name: Build PR 298 to UMD + Tag
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream and fetch PR 298
        run: |
          git remote add upstream https://github.com/editor-js/image.git
          git fetch upstream +refs/pull/298/head:refs/remotes/upstream/pr/298
          git switch -C pr-298 refs/remotes/upstream/pr/298

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build (repo script)
        run: npm run build

      - name: Ensure UMD bundle
        run: |
          mkdir -p dist_publish
          # Try common build outputs first; fallback to source if needed
          if [ -f dist/index.js ]; then IN=dist/index.js; \
          elif [ -f dist/image.js ]; then IN=dist/image.js; \
          elif [ -f dist/bundle.js ]; then IN=dist/bundle.js; \
          else IN=src/index.ts; fi
          npx --yes esbuild@latest "$IN" \
            --bundle \
            --format=iife \
            --global-name=ImageTool \
            --outfile=dist_publish/image-tool.resize.pr298.umd.js
          
      - name: Commit dist and tag (idempotent)
        run: |
          # Always work on a dedicated build branch to avoid non-fast-forward issues
          git fetch origin
          git checkout -B pr-298-builds

          # Stage and commit the generated bundle (allow empty to keep tagging predictable)
          git add dist_publish/image-tool.resize.pr298.umd.js
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Build PR 298 UMD bundle" || true

          # Create a unique tag per run to avoid 'tag already exists'
          TAG="v-pr298-build-${GITHUB_RUN_NUMBER}"

          # If the tag name somehow already exists locally/remote, delete then recreate
          git tag -d "$TAG" 2>/dev/null || true
          git push origin :refs/tags/"$TAG" 2>/dev/null || true
          git tag "$TAG"

          # Push ONLY the build branch (force-with-lease is safe for CI-owned branches)
          git push --force-with-lease origin pr-298-builds

          # Push ONLY our new tag (do NOT use --tags)
          git push origin "$TAG"

